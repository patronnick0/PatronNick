<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
>

    <defs>

        <linearGradient
            id="fondo"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#38bdf8"
            />

            <stop
                offset="100%"
                stop-color="#2563eb"
            />
        </linearGradient>

        <filter id="brillo">

            <feGaussianBlur
                stdDeviation="2"
                result="blur"
            />

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>

        </filter>

    </defs>


    <rect
        x="4"
        y="4"
        width="56"
        height="56"
        rx="15"
        fill="#0f172a"
        stroke="url(#fondo)"
        stroke-width="4"
    />


    <text
        x="32"
        y="42"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="30"
        font-weight="900"
        fill="#ffffff"
        filter="url(#brillo)"
    >
        P
    </text>

</svg>