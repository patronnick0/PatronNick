<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PatronNick</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="app">

    <!-- BARRA SUPERIOR -->
    <div id="topBar" class="top-bar">

        <button id="btnInicio" class="top-btn">
            ← Inicio
        </button>

    </div>


    <!-- HERO -->
    <section id="hero" class="hero">

        <h1 class="logo">
            PatronNick
        </h1>

        <p class="subtitle">
            Generador de nombres para Free Fire, Fortnite, Roblox y más.
        </p>

    </section>


    <!-- FAVORITOS -->
    <section id="zonaFavoritos" class="favorites-zone">

        <button id="abrirFavoritos" class="btn-top">

            ⭐Favoritos

            <span id="contadorFavoritos">
                (0)
            </span>

        </button>

        <div
            id="panelFavoritos"
            class="favorites-panel"
            style="display:none;">
        </div>

    </section>


    <!-- GENERADOR -->
    <section id="generator" class="generator">

        <input
            type="text"
            id="inputNombre"
            placeholder="Escribe tu nombre..."
        >

        <button id="btnGenerar">
            Generar
        </button>

        <div id="resultados"></div>

    </section>


    <!-- CATEGORÍAS -->
    <h2 id="categorias" class="categorias">
        Categorías
    </h2>


    <!-- JUEGOS -->
    <section id="games" class="games">

        <button
            class="game-card"
            id="freefireBtn">

            🔥

            <span>
                Free Fire
            </span>

        </button>


        <button class="game-card">

            🎮

            <span>
                Fortnite
            </span>

        </button>


        <button class="game-card">

            🟩

            <span>
                Roblox
            </span>

        </button>


        <button class="game-card">

            ⛏️

            <span>
                Minecraft
            </span>

        </button>

    </section>


    <!-- CONTENIDO DINÁMICO -->
    <div
        id="contenido"
        style="display:none;width:100%;max-width:820px;">
    </div>

</main>


<!-- JAVASCRIPT -->

<script src="js/fonts.js"></script>

<script src="js/generator.js"></script>

<script src="js/categorias.js"></script>

<script src="js/favoritos.js"></script>

<script src="js/cards.js"></script>

<script src="js/ui.js"></script>

<script src="js/freefire.js"></script>

<script src="js/script.js"></script>

</body>

</html>
